# Docker Compose file for running Paperless-ngx (v3.x).
# Based on the official docker/compose/docker-compose.postgres-tika.yml template.
#
# Optional services Apache Tika + Gotenberg are enabled: they provide support
# for consuming Office documents (Word, Excel, PowerPoint and LibreOffice
# counterparts) and E-Mails (.eml).
services:
  broker:
    container_name: paperless_valkey
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - ./redisdata:/data
    networks:
      - paperless_network

  db:
    container_name: paperless_db
    image: docker.io/library/postgres:18
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    networks:
      - paperless_network

  webserver:
    container_name: paperless_web
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8002:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    networks:
      - paperless_network

  gotenberg:
    container_name: paperless_gotenberg
    image: docker.io/gotenberg/gotenberg:8.37
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^file:///tmp/.*"
    networks:
      - paperless_network

  tika:
    container_name: paperless_tika
    image: docker.io/apache/tika:3.3.1.0
    restart: unless-stopped
    networks:
      - paperless_network

networks:
  paperless_network:
    driver: bridge